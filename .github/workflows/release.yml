name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_dir="${RUNNER_TEMP}/nexnote-unsigned"
          mkdir -p "$unsigned_dir"

          ./gradlew --no-daemon --no-build-cache clean assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "${unsigned_dir}/NexNote-${GITHUB_REF_NAME}.apk"

          printf 'UNSIGNED_APK_DIR=%s\n' "$unsigned_dir" >> "$GITHUB_ENV"

      - name: Validate unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          release_version="${GITHUB_REF_NAME#v}"
          expected_code="$(sed -nE 's/^[[:space:]]*val baseVersionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          apk="${UNSIGNED_APK_DIR}/NexNote-${GITHUB_REF_NAME}.apk"
          badging="$("${build_tools}/aapt" dump badging "$apk")"
          actual_abis="$(unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u | paste -sd, -)"

          test -n "$expected_code"
          test -s "app/build/outputs/mapping/release/mapping.txt"
          grep -F "versionCode='${expected_code}'" <<< "$badging"
          grep -F "versionName='${release_version}'" <<< "$badging"
          test "$actual_abis" = "arm64-v8a,armeabi-v7a,x86,x86_64"
          test "$(stat -c%s "$apk")" -lt 15728640

      - name: Install reproducible signing tools
        shell: bash
        run: |
          set -euo pipefail
          signing_build_tools="${ANDROID_HOME}/build-tools/34.0.0"
          if [[ ! -x "${signing_build_tools}/apksigner" ]]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          fi
          test -x "${signing_build_tools}/apksigner"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_FILE:?Missing KEYSTORE_FILE secret}"
          keystore_path="${RUNNER_TEMP}/nexnote-release.keystore"
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          signed_dir="${RUNNER_TEMP}/nexnote-signed"
          mkdir -p "$signed_dir"
          alignment_build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          signing_build_tools="${ANDROID_HOME}/build-tools/34.0.0"

          for unsigned_apk in "${UNSIGNED_APK_DIR}"/*.apk; do
            signed_apk="${signed_dir}/$(basename "$unsigned_apk")"
            "$alignment_build_tools/zipalign" -c -P 16 -v 4 "$unsigned_apk"
            "$signing_build_tools/apksigner" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$signed_apk" \
              "$unsigned_apk"
            "$signing_build_tools/apksigner" verify --verbose --print-certs "$signed_apk"
          done

          printf 'SIGNED_APK_DIR=%s\n' "$signed_dir" >> "$GITHUB_ENV"

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f -- "${KEYSTORE_PATH:-}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t signed_apks < <(find "$SIGNED_APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#signed_apks[@]}" -eq 1
          gh release create "$GITHUB_REF_NAME" "${signed_apks[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexNote ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag
