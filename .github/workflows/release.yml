name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_FILE:?Missing KEYSTORE_FILE secret}"
          keystore_path="${RUNNER_TEMP}/nexnote-release.keystore"
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="app/build/outputs/apk/release/NexNote-${GITHUB_REF_NAME}-aligned.apk"
          signed_apk="app/build/outputs/apk/release/NexNote-${GITHUB_REF_NAME}.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"

          test -f "$unsigned_apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$signed_apk"

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f -- "${KEYSTORE_PATH:-}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signed_apk="app/build/outputs/apk/release/NexNote-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "$signed_apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexNote ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag
