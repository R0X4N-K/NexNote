name: Feature request
description: Suggest an improvement for NexNote.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should NexNote do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
  - type: checkboxes
    id: fdroid
    attributes:
      label: F-Droid compatibility
      options:
        - label: This can work without proprietary services or required network accounts.
